# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# npm Trusted Publishing is configured for this established package and workflow.
# No long-lived npm token belongs in repository secrets. Provenance is signed by
# GitHub's OIDC infrastructure.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# Releases use v-prefixed release tags, for example v0.1.2.
#
# Never run the publish command locally. An authorized, immutable version tag
# triggers this workflow after package.json already contains that version.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use the lockfile npm version
        run: npm install --global npm@11.19.0

      - name: Verify npm supports Trusted Publishing
        run: node scripts/verify-npm-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Audit release configuration
        run: npm run release:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run official scanner preflight
        run: npm run scan:source

      - name: Inspect package boundary
        run: npm run package:check

      - name: Load compiled nodes and credential
        run: npm run smoke:load

      - name: Install and load packed package
        run: npm run smoke:install

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # The complete prepublication gates above run before the CLI's CI-mode
        # lint/build/publish path. The pushed tag must already name package.json's version.
        #
        # prepare-npm-auth removes setup-node's empty token placeholder so npm
        # can perform the Trusted Publisher OIDC exchange.
        run: |
          node scripts/prepare-npm-auth.mjs
          npm run release

      - name: Verify published package
        run: npm run scan:published
