# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# After the first publication — OIDC Trusted Publishing (no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: BlackSwampAI
#        Repository name:  n8n-nodes-openobserve
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Allow direct npm publish for this workflow.
#   5. Delete the NPM_TOKEN repository secret and revoke the temporary token.
#
# First publication only — temporary granular token bootstrap:
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Scope it to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret.
#      Name it NPM_TOKEN and paste the token value.
#
# Both phases work with --provenance. Provenance is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This template uses v-prefixed release tags, for example v0.1.0.
#
# Never run the publish command locally. An authorized, immutable version tag
# triggers this workflow after package.json already contains that version.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use the lockfile npm version
        run: npm install --global npm@11.16.0

      - name: Verify npm supports Trusted Publishing
        run: node scripts/verify-npm-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Audit release configuration
        run: npm run release:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Inspect package boundary
        run: npm run package:check

      - name: Load compiled nodes and credential
        run: npm run smoke:load

      - name: Install and load packed package
        run: npm run smoke:install

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # The complete prepublication gates above run before the CLI's CI-mode
        # lint/build/publish path. The pushed tag must already name package.json's version.
        #
        # Option A (OIDC): leave NPM_TOKEN unset and npm uses the OIDC exchange.
        # Option B (first publication): setup-node reads NODE_AUTH_TOKEN from the
        #   narrowly scoped NPM_TOKEN repository secret.
        run: |
          node scripts/prepare-npm-auth.mjs
          npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        run: npm run scan:published
